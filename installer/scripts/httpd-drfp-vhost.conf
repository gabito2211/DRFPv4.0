#
# VirtualHost del Sistema DRFP - generado por el instalador
# Este archivo reemplaza el contenido de httpd-vhosts.conf
#

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "__RUTA_APP__/public"

    <Directory "__RUTA_APP__/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /phpmyadmin "__RUTA_XAMPP__/phpMyAdmin"
    <Directory "__RUTA_XAMPP__/phpMyAdmin">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "__RUTA_XAMPP__/apache/logs/drfp-error.log"
    CustomLog "__RUTA_XAMPP__/apache/logs/drfp-access.log" common
</VirtualHost>
